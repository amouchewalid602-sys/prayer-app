<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>تطبيق صلاة</title>
<style>
  body{margin:0;font-family:sans-serif;background:#f4f8ff;color:#12305a;text-align:center;padding-bottom:70px}
  h1{margin:0;padding:18px;background:#1565c0;color:#fff;font-size:22px}
  .tab{display:none;padding-top:8px}.tab.on{display:block}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #cfe0fb}
  nav button{flex:1;padding:14px 4px;background:none;border:0;color:#1565c0;font-size:14px}
  nav button.on{background:#e3f0ff;color:#0d47a1;font-weight:bold}
  #city{padding:10px;font-size:14px;color:#4a6a96}
  #next{margin:15px;padding:15px;background:#1565c0;color:#fff;border-radius:12px;font-size:20px;font-weight:bold}
  #next:empty{display:none}
  .row{display:flex;justify-content:space-between;margin:8px 15px;padding:14px;background:#fff;border-radius:10px;font-size:18px;box-shadow:0 1px 4px rgba(21,101,192,.18)}
  .card{margin:10px 15px;padding:16px;background:#fff;border-radius:12px;font-size:18px;line-height:1.9;box-shadow:0 1px 4px rgba(21,101,192,.18)}
  .cnt{display:inline-block;margin-top:8px;padding:6px 16px;background:#1565c0;color:#fff;border-radius:20px;font-weight:bold}
  .done{opacity:.45}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 15px}
  .grid div{padding:14px 4px;background:#fff;border-radius:10px;font-size:17px;box-shadow:0 1px 4px rgba(21,101,192,.18)}
  .src{font-size:14px;color:#4a6a96}
  .manual{margin:15px;padding:14px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(21,101,192,.18)}
  .manual input{width:42%;padding:10px;margin:4px;border:1px solid #b9d3f5;border-radius:8px;font-size:15px}
  .manual button{margin-top:8px;padding:10px 24px;background:#1565c0;color:#fff;border:0;border-radius:20px;font-size:15px}
</style>
</head>
<body>
<h1>🕌 تطبيق صلاة</h1>

<div id="t1" class="tab on">
  <div id="city">جارٍ تحديد موقعك...</div>
  <div id="next"></div>
  <div id="list"></div>
  <div class="manual">
    <div>تغيير المدينة (بالإنجليزية)</div>
    <input id="inCity" placeholder="City مثل Casablanca">
    <input id="inCountry" placeholder="Country مثل Morocco">
    <br><button onclick="byCity()">تحديث المواقيت</button>
  </div>
</div>

<div id="t2" class="tab"><div id="adhkar"></div></div>
<div id="t3" class="tab"><div class="grid" id="asmaa"></div></div>
<div id="t4" class="tab"><div class="card" id="hadith"></div></div>

<nav>
  <button class="on" onclick="show(1,this)">المواقيت</button>
  <button onclick="show(2,this)">الأذكار</button>
  <button onclick="show(3,this)">الأسماء</button>
  <button onclick="show(4,this)">حديث اليوم</button>
</nav>

<script>
function show(n,b){
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){tabs[i].classList.remove("on");}
  document.getElementById("t"+n).classList.add("on");
  var bs=document.querySelectorAll("nav button");
  for(var j=0;j<bs.length;j++){bs[j].classList.remove("on");}
  b.classList.add("on");
}
</script>

<script>
/* ===== المواقيت ===== */
var PN={Fajr:"الفجر",Sunrise:"الشروق",Dhuhr:"الظهر",Asr:"العصر",Maghrib:"المغرب",Isha:"العشاء"};
var T={};
var ticking=false;

function setCity(msg){document.getElementById("city").textContent=msg;}

function render(){
  if(!T.Fajr){return;}
  var html="",now=new Date(),next=null,nextDiff=Infinity;
  for(var k in PN){
    var p=T[k].split(" ")[0].split(":");
    var t=new Date();t.setHours(Number(p[0]),Number(p[1]),0,0);
    var diff=t-now;if(diff<0){diff+=86400000;}
    if(diff<nextDiff){nextDiff=diff;next=k;}
    html+='<div class="row"><span>'+PN[k]+'</span><span>'+p[0]+':'+p[1]+'</span></div>';
  }
  document.getElementById("list").innerHTML=html;
  var s=Math.floor(nextDiff/1000),hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
  document.getElementById("next").textContent=PN[next]+" بعد "+hh+":"+(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
}

function load(url,label){
  setCity("جارٍ تحميل المواقيت...");
  fetch(url).then(function(r){return r.json();}).then(function(d){
    T=d.data.timings;
    setCity(d.data.date.readable+" | "+label);
    render();
    if(!ticking){ticking=true;setInterval(render,1000);}
  }).catch(function(){
    setCity("تعذّر تحميل المواقيت، تأكد من الإنترنت أو اكتب مدينتك بالأسفل");
  });
}

function byCoords(lat,lon){
  load("https://api.aladhan.com/v1/timings?latitude="+lat+"&longitude="+lon+"&method=4","موقعك الحالي");
}

function byCity(){
  var c=document.getElementById("inCity").value.trim();
  var k=document.getElementById("inCountry").value.trim();
  if(!c||!k){setCity("اكتب المدينة والدولة بالإنجليزية");return;}
  try{localStorage.setItem("salat_city",c);localStorage.setItem("salat_country",k);}catch(e){}
  load("https://api.aladhan.com/v1/timingsByCity?city="+encodeURIComponent(c)+"&country="+encodeURIComponent(k)+"&method=4",c);
}

(function start(){
  var c="",k="";
  try{c=localStorage.getItem("salat_city")||"";k=localStorage.getItem("salat_country")||"";}catch(e){}
  if(c&&k){
    document.getElementById("inCity").value=c;
    document.getElementById("inCountry").value=k;
    byCity();
    return;
  }
  if(!navigator.geolocation){setCity("الموقع غير متاح، اكتب مدينتك بالأسفل");return;}
  navigator.geolocation.getCurrentPosition(
    function(p){byCoords(p.coords.latitude,p.coords.longitude);},
    function(){setCity("تعذّر تحديد الموقع، اكتب مدينتك بالأسفل");},
    {timeout:8000,maximumAge:600000}
  );
  setTimeout(function(){
    if(!T.Fajr&&document.getElementById("city").textContent.indexOf("جارٍ تحديد")===0){
      setCity("تعذّر تحديد الموقع، اكتب مدينتك بالأسفل");
    }
  },10000);
})();
</script>

<script>
/* ===== الأذكار ===== */
var adhkar=[
 {t:"أعوذ بالله من الشيطان الرجيم: ﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...﴾ (آية الكرسي)",c:1},
 {t:"سورة الإخلاص، وسورة الفلق، وسورة الناس (صباحًا ومساءً)",c:3},
 {t:"أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير",c:1},
 {t:"اللهم بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت، وإليك النشور",c:1},
 {t:"اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت (سيد الاستغفار)",c:1},
 {t:"بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم",c:3},
 {t:"رضيت بالله ربًا، وبالإسلام دينًا، وبمحمد ﷺ نبيًا",c:3},
 {t:"سبحان الله وبحمده",c:100},
 {t:"لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير",c:10},
 {t:"أستغفر الله وأتوب إليه",c:100},
 {t:"سبحان الله (بعد الصلاة)",c:33},
 {t:"الحمد لله (بعد الصلاة)",c:33},
 {t:"الله أكبر (بعد الصلاة)",c:34},
 {t:"اللهم صلِّ وسلّم على نبينا محمد",c:10}
];
var leftCount=[];
(function(){
  var html="";
  for(var i=0;i<adhkar.length;i++){
    leftCount.push(adhkar[i].c);
    html+='<div class="card" id="a'+i+'" onclick="tap('+i+')">'+adhkar[i].t+'<br><span class="cnt" id="c'+i+'">'+adhkar[i].c+'</span></div>';
  }
  document.getElementById("adhkar").innerHTML=html;
})();
function tap(i){
  if(leftCount[i]>0){
    leftCount[i]--;
    document.getElementById("c"+i).textContent=leftCount[i];
    if(leftCount[i]===0){document.getElementById("a"+i).classList.add("done");}
    if(navigator.vibrate){navigator.vibrate(30);}
  }
}
</script>

<script>
/* ===== أسماء الله الحسنى ===== */
var asmaaList="الرحمن،الرحيم،الملك،القدوس،السلام،المؤمن،المهيمن،العزيز،الجبار،المتكبر،الخالق،البارئ،المصور،الغفار،القهار،الوهاب،الرزاق،الفتاح،العليم،القابض،الباسط،الخافض،الرافع،المعز،المذل،السميع،البصير،الحكم،العدل،اللطيف،الخبير،الحليم،العظيم،الغفور،الشكور،العلي،الكبير،الحفيظ،المقيت،الحسيب،الجليل،الكريم،الرقيب،المجيب،الواسع،الحكيم،الودود،المجيد،الباعث،الشهيد،الحق،الوكيل،القوي،المتين،الولي،الحميد،المحصي،المبدئ،المعيد،المحيي،المميت،الحي،القيوم،الواجد،الماجد،الواحد،الأحد،الصمد،القادر،المقتدر،المقدم،المؤخر،الأول،الآخر،الظاهر،الباطن،الوالي،المتعالي،البر،التواب،المنتقم،العفو،الرؤوف،مالك الملك،ذو الجلال والإكرام،المقسط،الجامع،الغني،المغني،المانع،الضار،النافع،النور،الهادي،البديع،الباقي،الوارث،الرشيد،الصبور".split("،");
(function(){
  var html="";
  for(var i=0;i<asmaaList.length;i++){
    html+="<div>"+(i+1)+"<br>"+asmaaList[i]+"</div>";
  }
  document.getElementById("asmaa").innerHTML=html;
})();
</script>

<script>
/* ===== حديث اليوم ===== */
var hadiths=[
 ["إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى","متفق عليه"],
 ["من حسن إسلام المرء تركه ما لا يعنيه","رواه الترمذي"],
 ["لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه","متفق عليه"],
 ["من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت","متفق عليه"],
 ["الدين النصيحة","رواه مسلم"],
 ["خيركم من تعلم القرآن وعلمه","رواه البخاري"],
 ["الطهور شطر الإيمان","رواه مسلم"],
 ["أحب الأعمال إلى الله أدومها وإن قل","متفق عليه"],
 ["كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم","متفق عليه"],
 ["ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب","متفق عليه"],
 ["من سلك طريقًا يلتمس فيه علمًا سهّل الله له به طريقًا إلى الجنة","رواه مسلم"],
 ["لا تغضب","رواه البخاري"],
 ["المسلم من سلم المسلمون من لسانه ويده","متفق عليه"],
 ["الكلمة الطيبة صدقة","متفق عليه"],
 ["اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن","رواه الترمذي"],
 ["من دل على خير فله مثل أجر فاعله","رواه مسلم"],
 ["إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم","رواه مسلم"]
];
(function(){
  var d=new Date();
  var dayNum=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
  var item=hadiths[dayNum%hadiths.length];
  document.getElementById("hadith").innerHTML="قال رسول الله ﷺ:<br>«"+item[0]+"»<br><span class='src'>"+item[1]+"</span>";
})();

/* إلغاء أي نسخة قديمة محفوظة (كاش) */
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    rs.forEach(function(r){r.unregister();});
  }).catch(function(){});
  if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
}
</script>
</body>
</html>
