.cnt{display:inline-block;margin-top:8px;padding:6px 16px;background:var(--pri);color:#fff;border-radius:20px;font-weight:bold}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 15px}
.grid div{padding:14px 4px;background:var(--card);border-radius:10px;font-size:1.05rem;box-shadow:0 1px 4px var(--shadow)}
.src{font-size:.9rem;color:var(--sub)}
.manual{margin:15px;padding:14px;background:var(--card);border-radius:12px;box-shadow:0 1px 4px var(--shadow)}

.pick:after{content:"▾";float:left;color:var(--sub)}
.cat{display:flex;align-items:center;margin:14px 15px;padding:14px 16px;background:var(--card);border-radius:14px;box-shadow:0 1px 5px var(--shadow)}

.bar{display:flex;align-items:center;margin:12px 15px;padding:10px 14px;background:var(--card);border-radius:14px;font-weight:bold;box-shadow:0 1px 5px var(--shadow)}
.bar button{border:0;background:var(--sel);color:var(--link);width:38px;height:38px;border-radius:50%;font-size:1.5rem;line-height:1;margin-inline-end:12px}
#ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center}
#ov.open{display:flex}
#box{width:min(90vw,360px);aspect-ratio:1/1;overflow:auto;background:var(--card);color:var(--fg);border-radius:18px;padding:12px;box-sizing:border-box;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bh b{font-size:1.1rem}
.bh button{border:0;background:var(--sel);color:var(--link);width:34px;height:34px;border-radius:50%;font-size:1rem}
.lbl{font-size:.9rem;color:var(--sub);margin:4px 0}

<script>
if(typeof COUNTRIES==="undefined"){var COUNTRIES=[];}

function show(n,b){
var wasAd=document.getElementById("t2").classList.contains("on");
var tabs=document.querySelectorAll(".tab");
for(var i=0;i<tabs.length;i++){tabs[i].classList.remove("on");}
document.getElementById("t"+n).classList.add("on");
var bs=document.querySelectorAll("nav button");
for(var j=0;j<bs.length;j++){bs[j].classList.remove("on");}
b.classList.add("on");
if(n===2&&wasAd&&typeof backCat==="function"){backCat();}
}

var S={s:1,dark:0,h12:0,vib:1};
try{
var saved=JSON.parse(localStorage.getItem("salat_set")||"{}");
for(var key in saved){S[key]=saved[key];}
}catch(e){}
if(!(S.s>=0.8&&S.s<=1.6)){S.s=1;}

function saveSet(){try{localStorage.setItem("salat_set",JSON.stringify(S));}catch(e){}}
function applySet(){
document.documentElement.style.setProperty("--s",S.s);
if(S.dark){document.body.classList.add("dark");}else{document.body.classList.remove("dark");}
document.getElementById("pct").textContent=Math.round(S.s*100)+"%";
document.getElementById("bDark").textContent=S.dark?"☀️ الوضع النهاري":"🌙 الوضع الليلي";
document.getElementById("bFmt").textContent=S.h12?"🕐 الوقت: 12 ساعة":"🕐 الوقت: 24 ساعة";
document.getElementById("bVib").textContent=S.vib?"📳 الاهتزاز: يعمل":"📴 الاهتزاز: متوقف";
}
function openSet(){document.getElementById("ov").classList.add("open");}
function closeSet(){document.getElementById("ov").classList.remove("open");}
function fs(dir){
S.s=Math.round((S.s+dir*0.1)*10)/10;
if(S.s<0.8){S.s=0.8;}
if(S.s>1.6){S.s=1.6;}
saveSet();applySet();
}
function resetFont(){S.s=1;saveSet();applySet();}
function toggleDark(){S.dark=S.dark?0:1;saveSet();applySet();}
function toggleFmt(){S.h12=S.h12?0:1;saveSet();applySet();render();}
function toggleVib(){
S.vib=S.vib?0:1;saveSet();applySet();
if(S.vib&&navigator.vibrate){navigator.vibrate(40);}
}
function goCity(){
closeSet();
show(1,document.querySelectorAll("nav button")[0]);
document.getElementById("manual").scrollIntoView();
openPick("country");
}
function resetAdhkar(){
if(typeof doResetAdhkar==="function"){doResetAdhkar();}
closeSet();
}
applySet();

var PN={Fajr:"الفجر",Sunrise:"الشروق",Dhuhr:"الظهر",Asr:"العصر",Maghrib:"المغرب",Isha:"العشاء"};
var T={};
var ticking=false;

function pad(n){return n<10?"0"+n:""+n;}
function fmt(h,m){
if(!S.h12){return pad(h)+":"+pad(m);}
var ap=h>=12?"م":"ص";
var hh=h%12;if(hh===0){hh=12;}
return hh+":"+pad(m)+" "+ap;
}
function setCity(msg){document.getElementById("city").textContent=msg;}

function render(){
if(!T.Fajr){return;}
var html="",now=new Date(),next=null,nextDiff=Infinity;
for(var k in PN){
var p=T[k].split(" ")[0].split(":");
var h=Number(p[0]),m=Number(p[1]);
var t=new Date();t.setHours(h,m,0,0);
var diff=t-now;if(diff<0){diff+=86400000;}
if(diff<nextDiff){nextDiff=diff;next=k;}
html+='<div class="row"><span>'+PN[k]+'</span><span>'+fmt(h,m)+'</span></div>';
}
document.getElementById("list").innerHTML=html;
var s=Math.floor(nextDiff/1000),hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
document.getElementById("next").textContent=PN[next]+" بعد "+hh+":"+pad(mm)+":"+pad(ss);
}

function load(url,label){
setCity("جارٍ تحميل المواقيت...");
fetch(url).then(function(r){return r.json();}).then(function(d){
T=d.data.timings;
setCity(d.data.date.readable+" | "+label);
render();
if(!ticking){ticking=true;setInterval(render,1000);}
}).catch(function(){
setCity("تعذّر تحميل المواقيت، تأكد من الإنترنت أو اختر مدينتك من الأسفل");
});
}
function byCoords(lat,lon){
load("https://api.aladhan.com/v1/timings?latitude="+lat+"&longitude="+lon+"&method=4","موقعك الحالي");
}
function byCityNames(c,k,label){
try{localStorage.setItem("salat_city",c);localStorage.setItem("salat_country",k);}catch(e){}
load("https://api.aladhan.com/v1/timingsByCity?city="+encodeURIComponent(c)+"&country="+encodeURIComponent(k)+"&method=4",label);
}

var selC=null,selK=null;
function setLabels(){
document.getElementById("pC").textContent=selC?selC.n:"اختر الدولة";
document.getElementById("pK").textContent=selK?selK[0]:"اختر المدينة";
}
function openPick(kind){
var html="",title="";
if(kind==="country"){
title="الدول";
for(var i=0;i<COUNTRIES.length;i++){
html+='<button class="opt'+(selC&&selC===COUNTRIES[i]?' sel':'')+'" onclick="pickC('+i+')">'+COUNTRIES[i].n+'</button>';
}
}else{
if(!selC){openPick("country");return;}
title="مدن "+selC.n;
for(var j=0;j<selC.c.length;j++){
html+='<button class="opt'+(selK&&selK===selC.c[j]?' sel':'')+'" onclick="pickK('+j+')">'+selC.c[j][0]+'</button>';
}
}
if(!html){html='<div class="card">تعذّر تحميل ملف المدن (cities.js)</div>';}
document.getElementById("pkt").textContent=title;
document.getElementById("pkl").innerHTML=html;
document.getElementById("pkl").scrollTop=0;
document.getElementById("pk").classList.add("open");
}
function closePick(){document.getElementById("pk").classList.remove("open");}
function pickC(i){
selC=COUNTRIES[i];selK=null;
setLabels();
closePick();
setTimeout(function(){openPick("city");},150);
}
function pickK(j){
selK=selC.c[j];
setLabels();
closePick();
byCityNames(selK[1],selC.e,selK[0]+"، "+selC.n);
}

(function start(){
var c="",k="";
try{c=localStorage.getItem("salat_city")||"";k=localStorage.getItem("salat_country")||"";}catch(e){}
if(c&&k){
var label=c+"، "+k;
for(var i=0;i<COUNTRIES.length;i++){
if(COUNTRIES[i].e===k){
selC=COUNTRIES[i];
for(var j=0;j<selC.c.length;j++){
if(selC.c[j][1]===c){selK=selC.c[j];}
}
label=(selK?selK[0]:c)+"، "+selC.n;
}
}
setLabels();
byCityNames(c,k,label);
return;
}
if(!navigator.geolocation){setCity("اختر مدينتك من الأسفل");return;}
navigator.geolocation.getCurrentPosition(
function(p){byCoords(p.coords.latitude,p.coords.longitude);},
function(){setCity("تعذّر تحديد الموقع، اختر مدينتك من الأسفل");},
{timeout:8000,maximumAge:600000}
);
setTimeout(function(){
if(!T.Fajr&&document.getElementById("city").textContent.indexOf("جارٍ تحديد")===0){
setCity("تعذّر تحديد الموقع، اختر مدينتك من الأسفل");
}
},10000);
})();
</script>

"المغرب":"Maghrib",
"العشاء":"Isha",
"اختر اللغة":"Choose language",
"إغلاق":"Close",
"تعذّر تحديد الموقع، اختر مدينتك من الأسفل":"Unable to detect location. Choose a city below.",
"ابحث عن اسم...":"Search for a name...",
"لا توجد نتيجة":"No results",
"الأسماء الظاهرة:":"Displayed names:"
}
};

function tr(value) {
if (lang === "ar") return value;
return (translations[lang] && translations[lang][value]) || value;
}

var style = document.createElement("style");
style.textContent = `
#langBtn{
position:absolute;right:10px;top:50%;
transform:translateY(-50%);
width:42px;height:42px;
border:1px solid rgba(255,255,255,.65);
border-radius:12px;background:transparent;
color:white;display:flex;align-items:center;
justify-content:center;cursor:pointer
}
#langBtn svg{width:24px;height:24px}
#langOverlay{
display:none;position:fixed;inset:0;
z-index:100;background:rgba(0,0,0,.55);
align-items:center;justify-content:center
}
#langOverlay.open{display:flex}
#langBox{
width:min(88vw,340px);padding:20px;
border-radius:18px;background:var(--card);
color:var(--fg);box-shadow:0 8px 30px rgba(0,0,0,.3)
}
#langBox h3{margin:0 0 16px}
.langOption{
display:block;width:100%;padding:14px;
margin:8px 0;border:1px solid var(--line);
border-radius:12px;background:var(--bg);
color:var(--fg);font-size:1rem;text-align:start
}
.langOption.active{border:2px solid var(--pri);background:var(--sel);font-weight:bold}
#langClose{
width:100%;padding:12px;margin-top:8px;
border:0;border-radius:10px;background:var(--pri);
color:white;font-size:1rem
}
`;
document.head.appendChild(style);

var heading = document.querySelector("h1");
if (heading) {
var btn = document.createElement("button");
btn.id = "langBtn";
btn.setAttribute("aria-label", "Change language");
btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.8 12h18.4M12 2.5c2.5 2.6 3.8 5.8 3.8 9.5S14.5 18.9 12 21.5C9.5 18.9 8.2 15.7 8.2 12S9.5 5.1 12 2.5z"/></svg>';
btn.onclick = openLanguage;
heading.appendChild(btn);
}

var overlay = document.createElement("div");
overlay.id = "langOverlay";
overlay.innerHTML = `
<div id="langBox">
<h3 id="langHeading">اختر اللغة</h3>
<button class="langOption" data-lang="ar">العربية</button>
<button class="langOption" data-lang="fr">Français</button>
<button class="langOption" data-lang="en">English</button>
<button id="langClose">إغلاق</button>
</div>`;
document.body.appendChild(overlay);

overlay.addEventListener("click", function(e) {
if (e.target === overlay) closeLanguage();
});

overlay.querySelectorAll(".langOption").forEach(function(button) {
button.addEventListener("click", function() {
changeLanguage(button.dataset.lang);
});
});

document.getElementById("langClose").onclick = closeLanguage;

function openLanguage() {
overlay.classList.add("open");
}

function closeLanguage() {
overlay.classList.remove("open");
}

function changeLanguage(code) {
if (code !== "ar" && code !== "fr" && code !== "en") return;
lang = code;
localStorage.setItem(KEY, lang);
applyLanguage();
closeLanguage();
}

function set(id, value) {
var el = document.getElementById(id);
if (el) el.textContent = value;
}

function translateCountryLabels() {
if (typeof selC !== "undefined" && selC) {
var pc = document.getElementById("pC");
if (pc) pc.textContent = lang === "ar" ? selC.n : selC.e;
}
if (typeof selK !== "undefined" && selK) {
var pk = document.getElementById("pK");
if (pk) pk.textContent = lang === "ar" ? selK[0] : selK[1];
}
}

function applyLanguage() {
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

var navButtons = document.querySelectorAll("nav button");
var navArabic = ["المواقيت","الأذكار","الأسماء","حديث اليوم"];

navButtons.forEach(function(button, index) {
if (navArabic[index]) button.textContent = tr(navArabic[index]);
});

var labels = document.querySelectorAll("#box .lbl");
labels.forEach(function(el) {
if (!el.dataset.arabic) el.dataset.arabic = el.textContent;
el.textContent = tr(el.dataset.arabic);
});

var bDark = document.getElementById("bDark");
var bFmt = document.getElementById("bFmt");
var bVib = document.getElementById("bVib");

if (bDark) {
bDark.textContent = (S.dark ? "☀️ " : "🌙 ") +
tr(S.dark ? "الوضع النهاري" : "الوضع الليلي");
}
if (bFmt) {
bFmt.textContent = "🕐 " + tr(S.h12 ? "الوقت: 12 ساعة" : "الوقت: 24 ساعة");
}
if (bVib) {
bVib.textContent = (S.vib ? "📳 " : "📴 ") +
tr(S.vib ? "الاهتزاز: يعمل" : "الاهتزاز: متوقف");
}

var settingsButtons = document.querySelectorAll("#box .g2 button");
var settingTexts = [
"تصفير العدّادات",
"تغيير المدينة",
"إعادة حجم الخط"
];
settingsButtons.forEach(function(button) {
var original = button.dataset.original;
if (!original) {
original = button.textContent;
button.dataset.original = original;
}
var text = original;
settingTexts.forEach(function(item) {
text = text.replace(item, tr(item));
});
button.textContent = text;
});

set("langHeading", tr("اختر اللغة"));
set("langClose", tr("إغلاق"));

overlay.querySelectorAll(".langOption").forEach(function(button) {
button.classList.toggle("active", button.dataset.lang === lang);
});

var city = document.getElementById("city");
if (city && city.dataset.arabic) city.textContent = tr(city.dataset.arabic);

var manualTitle = document.querySelector("#manual .uth");
if (manualTitle) {
if (!manualTitle.dataset.arabic) manualTitle.dataset.arabic = "📍 اختر موقعك";
manualTitle.textContent = tr(manualTitle.dataset.arabic);
}

var pc = document.getElementById("pC");
var pk = document.getElementById("pK");
if (pc && !selC) pc.textContent = tr("اختر الدولة");
if (pk && !selK) pk.textContent = tr("اختر المدينة");

translateCountryLabels();

if (typeof render === "function") render();
}

var originalSetCity = window.setCity;
if (typeof originalSetCity === "function") {
window.setCity = function(message) {
var el = document.getElementById("city");
if (el) {
el.dataset.arabic = message;
el.textContent = tr(message);
}
};
}

var originalRender = window.render;
if (typeof originalRender === "function") {
window.render = function() {
originalRender();

document.querySelectorAll("#list .row span:first-child").forEach(function(el) {
if (!el.dataset.arabic) el.dataset.arabic = el.textContent;
el.textContent = tr(el.dataset.arabic);
});

var next = document.getElementById("next");
if (next && next.textContent) {
var names = ["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"];
var value = next.textContent;
names.forEach(function(name) {
value = value.replace(name, tr(name));
});
if (lang !== "ar") value = value.replace(" بعد ", " in ");
next.textContent = value;
}
};
}

var originalOpenPick = window.openPick;
if (typeof originalOpenPick === "function") {
window.openPick = function(kind) {
originalOpenPick(kind);
if (lang === "ar") return;

var title = document.getElementById("pkt");
if (title) {
if (kind === "country") {
title.textContent = tr("الدول");
} else if (selC) {
title.textContent = (lang === "fr" ? "Villes de " : "Cities of ") + selC.e;
}
}

document.querySelectorAll("#pkl .opt").forEach(function(el, index) {
if (kind === "country" && COUNTRIES[index]) {
el.textContent = COUNTRIES[index].e;
} else if (kind === "city" && selC && selC.c[index]) {
el.textContent = selC.c[index][1];
}
});
};
}

var originalSetLabels = window.setLabels;
if (typeof originalSetLabels === "function") {
window.setLabels = function() {
originalSetLabels();
translateCountryLabels();
};
}

window.openLanguage = openLanguage;
window.closeLanguage = closeLanguage;
window.changeLanguage = changeLanguage;
window.getAppLanguage = function() { return lang; };
window.appTranslate = tr;

applyLanguage();

})();
</script>
  
</body>
  </html>
